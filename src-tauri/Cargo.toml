[package]
name = "succint-reader"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "succint_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8.42"
regex = { version = "1.13.1", features = ["unicode-perl"] }
tar = "0.4.46"
flate2 = "1.1.10"
sha2 = "0.11.0"
hex = "0.4.3"
chrono = "0.4.45"
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-http = { version = "2.8.2", features = ["rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
